train {
    learning_rate = 5e-4
    learning_rate_alpha = 0.05
    end_iter = 300000
    batch_size = 512
    warm_up_end = 5000
    save_freq = 10000
    val_freq = 2500
    report_freq = 100

    igr_weight = 0.1      # eikonal loss weight
    mask_weight = 0.1
    depth_weight = 0.0    # TODO(you): >0 once get_depth_loss() is implemented
                           # and ablated -- see README "metric-accuracy" section
}

model {
    sdf_network {
        d_out = 257
        d_in = 3
        d_hidden = 256
        n_layers = 8
        skip_in = [4]
        multires = 6
        bias = 0.5
        scale = 1.0
        geometric_init = True
        weight_norm = True
    }

    rendering_network {
        d_feature = 256
        d_in = 9
        d_out = 3
        d_hidden = 256
        n_layers = 4
        multires_view = 4
        weight_norm = True
    }

    variance_network {
        init_val = 0.3
    }

    renderer {
        n_samples = 64
        n_importance = 64
        up_sample_steps = 4
        perturb = 1.0
    }
}
